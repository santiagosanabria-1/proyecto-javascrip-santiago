<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>CINEVERSE — Selección de asientos</title>
<link rel="stylesheet" href="css/styles.css"/>
<link rel="stylesheet" href="css/animations.css"/>
</head>
<body>

<nav class="navbar" data-navbar>
    <a class="navbar__brand" href="index.html">Cine<span>verse</span></a>
    <span class="navbar__step">PASO 3 DE 4 · ASIENTOS</span>
    <a href="#" data-back-link class="btn btn-outline">← Volver</a>
</nav>

<main class="seat-page">
    <div class="seat-page__title">
        <h1 data-seat-movie-title>Cargando...</h1>
    </div>
    <p class="seat-page__subtitle" data-seat-subtitle></p>

    <div class="ticket-qty">
        <span class="field-label">CANTIDAD DE TICKETS</span>
        <div class="ticket-qty__control">
            <button type="button" class="ticket-qty__btn" data-qty-minus aria-label="Menos tickets">−</button>
            <span class="ticket-qty__value" data-qty-value>1</span>
            <button type="button" class="ticket-qty__btn" data-qty-plus aria-label="Más tickets">+</button>
        </div>
        <p class="ticket-qty__hint" data-qty-hint></p>
    </div>

    <div class="screen-arc"><div class="screen-arc__glow"></div><div class="screen-arc__bar"></div></div>
    <p class="screen-label">PANTALLA</p>

    <div class="seat-panel" data-seat-map>
        <div class="seat-legend" data-seat-legend>
            <div class="seat-legend__item"><span class="seat-legend__swatch seat seat--available"></span>Disponible</div>
            <div class="seat-legend__item"><span class="seat-legend__swatch seat seat--selected">✓</span>Seleccionado</div>
            <div class="seat-legend__item"><span class="seat-legend__swatch seat seat--held">…</span>Eligiéndose ahora</div>
            <div class="seat-legend__item"><span class="seat-legend__swatch seat seat--reserved">◔</span>Reservado</div>
            <div class="seat-legend__item"><span class="seat-legend__swatch seat seat--sold">✕</span>Vendido</div>
        </div>
        <div style="display:flex;flex-direction:column;gap:12px;min-width:560px;">
            <div class="skeleton" style="height:32px;width:66%;margin:0 auto;"></div>
            <div class="skeleton" style="height:32px;width:75%;margin:0 auto;"></div>
            <div class="skeleton" style="height:32px;width:66%;margin:0 auto;"></div>
        </div>
    </div>

    <div class="seat-summary glass-panel">
        <div class="seat-summary__group">
            <div>
                <p class="seat-summary__label">ASIENTOS ELEGIDOS</p>
                <p class="seat-summary__value" data-summary-seats>Ninguno seleccionado</p>
            </div>
            <div class="seat-summary__divider"></div>
            <div>
                <p class="seat-summary__label">PRECIO UNITARIO</p>
                <p class="seat-summary__value" data-summary-unit-price>$0</p>
            </div>
            <div class="seat-summary__divider"></div>
            <div>
                <p class="seat-summary__label">TOTAL</p>
                <p class="seat-summary__total" data-summary-total>$0</p>
            </div>
            <div class="seat-summary__divider"></div>
            <div>
                <p class="seat-summary__label">UBICACIÓN</p>
                <p class="seat-summary__location" data-summary-location></p>
            </div>
        </div>
        <button class="btn btn-gold" data-continue-seats disabled>Continuar →</button>
    </div>
</main>

<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/ScrollTrigger.min.js"></script>
<script src="js/config.js"></script>
<script src="js/api/tmdb.js"></script>
<script src="js/api/cine.js"></script>
<script src="js/store.js"></script>
<script src="js/animations/global.js"></script>
<script src="js/animations/seats.js"></script>
<script src="js/ui-helpers.js"></script>
<script src="js/funcion.js"></script>
</body>
</html>
